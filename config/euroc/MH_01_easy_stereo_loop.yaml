%YAML:1.0
---
num_of_cam: 2
imu_topic: "/imu0"
image_topic: "/cam0/image_raw"
image1_topic: "/cam1/image_raw"
cam0_calib: "euroc_rectified_cam0.yaml"
cam1_calib: "euroc_rectified_cam1.yaml"
output_path: "/tmp/vins_output/"

model_type: PINHOLE
camera_name: euroc_rectified_cam0
image_width: 752
image_height: 480
distortion_parameters: {k1: 0.0, k2: 0.0, p1: 0.0, p2: 0.0}
projection_parameters: {fx: 436.24429565, fy: 436.24429565, cx: 364.44123459, cy: 256.95167542}

estimate_extrinsic: 0
extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [0.01632106, -0.99980559, 0.01106332,
          0.99971009, 0.01651340, 0.01752279,
          -0.01770207, 0.01077413, 0.99978525]
extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [-0.0216401454975, -0.064676986768, 0.00981073058949]
extrinsicRotation1: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [0.01632106, -0.99980559, 0.01106332,
          0.99971009, 0.01651340, 0.01752279,
          -0.01770207, 0.01077413, 0.99978525]
extrinsicTranslation1: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [-0.0198435579556, 0.0453689425024, 0.00786212447038]

max_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 0
equalize: 1
fisheye: 0
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

imu_noise_mode: discrete_std
acc_n: 0.08
gyr_n: 0.004
acc_w: 0.00004
gyr_w: 2.0e-6
g_norm: 9.81007

loop_closure: 1
load_previous_pose_graph: 0
fast_relocalization: 1
pose_graph_save_path: "/tmp/vins_output/pose_graph/"
estimate_td: 0
td: 0.0
rolling_shutter: 0
rolling_shutter_tr: 0.0
save_image: 0
visualize_imu_forward: 0
visualize_camera_size: 0.4

stereo_track: 1
stereo_fb_threshold: 0.5
stereo_epipolar_threshold: 1.0
stereo_backend_reprojection_threshold: 3.0
stereo_min_depth: 0.2
stereo_max_depth: 30.0
stereo_use_depth_init: 1
stereo_use_metric_init: 1
stereo_use_right_factors: 1
