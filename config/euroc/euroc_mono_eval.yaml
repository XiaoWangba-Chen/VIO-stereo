%YAML:1.0
---
num_of_cam: 1
imu_topic: "/imu0"
image_topic: "/cam0/image_raw"
output_path: "/tmp/vins_output/"

model_type: PINHOLE
camera_name: euroc_cam0
image_width: 752
image_height: 480
distortion_parameters: {k1: -0.28340811, k2: 0.07395907, p1: 0.00019359, p2: 0.0000176114}
projection_parameters: {fx: 458.654, fy: 457.296, cx: 367.215, cy: 248.375}

estimate_extrinsic: 0
extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [0.0148655429818, -0.999880929698, 0.00414029679422,
          0.999557249008, 0.0149672133247, 0.025715529948,
          -0.0257744366974, 0.00375618835797, 0.999660727178]
extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [-0.0216401454975, -0.064676986768, 0.00981073058949]

max_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 0
equalize: 1
fisheye: 0
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0
acc_n: 0.08
gyr_n: 0.004
acc_w: 0.00004
gyr_w: 2.0e-6
g_norm: 9.81007
loop_closure: 0
load_previous_pose_graph: 0
fast_relocalization: 0
pose_graph_save_path: "/tmp/vins_output/pose_graph/"
estimate_td: 0
td: 0.0
rolling_shutter: 0
rolling_shutter_tr: 0.0
save_image: 0
visualize_imu_forward: 0
visualize_camera_size: 0.4
stereo_track: 0
stereo_use_depth_init: 0
stereo_use_metric_init: 0
stereo_use_right_factors: 0
